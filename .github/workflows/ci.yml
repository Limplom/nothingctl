name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Build, vet, lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod

      - name: Prepare embedded data
        run: |
          cp ../debloat.json internal/data/debloat.json
          cp ../modules.json internal/data/modules.json

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  staticcheck:
    name: staticcheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # staticcheck@latest needs a newer toolchain than go.mod pins.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Prepare embedded data
        run: |
          cp ../debloat.json internal/data/debloat.json
          cp ../modules.json internal/data/modules.json

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          "$(go env GOPATH)/bin/staticcheck" ./...
